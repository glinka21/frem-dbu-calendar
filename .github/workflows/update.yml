name: Update Frem Calendar

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run:
          npm ci

      - run:
          npm run update

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message:
            "Update Frem calendar"

          file_pattern:
            calendar.ics
