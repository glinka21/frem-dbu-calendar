name: Update Frem Calendar

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

jobs:

  update:

    runs-on:
      ubuntu-latest

    steps:

      - uses:
          actions/checkout@v4

      - uses:
          actions/setup-node@v4

        with:
          node-version: 22

      - run:
          npm install

      - run:
          npm run update

      - uses:
          stefanzweifel/git-auto-commit-action@v5

        with:
          commit_message:
            "Update Frem calendar"
